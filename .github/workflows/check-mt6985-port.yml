name: Check MT6985 port slice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-clock-gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison bc libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Execute candidate C models and source contracts
        run: |
          python3 ports/mt6985/tests/run_vemc_model.py
          python3 ports/mt6985/tests/run_vemc_model.py --cc 'gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
          python3 ports/mt6985/tests/run_rcs_lifetime_model.py
          python3 ports/mt6985/tests/run_rcs_lifetime_model.py --cc 'gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
          python3 ports/mt6985/tests/run_rcs_model.py
          python3 ports/mt6985/tests/run_rcs_model.py --cc 'gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
          python3 ports/mt6985/tests/check_pmif_contract.py
          python3 ports/mt6985/tests/run_pmif_model.py
          python3 ports/mt6985/tests/run_pmif_model.py --cc 'gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
          python3 ports/mt6985/tests/run_power_model.py
          python3 ports/mt6985/tests/run_power_model.py --cc 'gcc -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Fetch pristine Linux 6.1
        run: |
          set -eux
          curl -fL --retry 3 -o linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.tar.xz
          tar xf linux.tar.xz
      - name: Install port slice and compile object
        run: |
          set -eux
          cd linux-6.1
          for p in ../ports/mt6985/patches/*.patch; do
            patch --batch --fuzz=0 -p1 < "$p"
          done
          diff --strip-trailing-cr -u ../ports/mt6985/linux-6.1/drivers/clk/mediatek/clk-mt6985-peri.c drivers/clk/mediatek/clk-mt6985-peri.c
          diff --strip-trailing-cr -u ../ports/mt6985/linux-6.1/include/dt-bindings/clock/mt6985-clk.h include/dt-bindings/clock/mt6985-clk.h
          diff --strip-trailing-cr -u ../ports/mt6985/linux-6.1/drivers/ufs/host/ufs-mediatek.c drivers/ufs/host/ufs-mediatek.c
          make defconfig
          scripts/config --enable SCSI_UFSHCD --enable SCSI_UFSHCD_PLATFORM --enable SCSI_UFS_MEDIATEK
          scripts/config --enable PM --enable PM_GENERIC_DOMAINS --enable PM_GENERIC_DOMAINS_OF --enable MFD_SYSCON
          scripts/config --enable REGULATOR --enable REGMAP --enable SPMI --enable REGMAP_SPMI --enable MFD_CORE --enable IRQ_DOMAIN
          make olddefconfig
          for f in drivers/regulator/mt6363-regulator.c drivers/regulator/mt6373-regulator.c include/linux/regulator/mt6363-regulator.h include/linux/regulator/mt6373-regulator.h include/linux/mfd/mt6363/registers.h include/linux/mfd/mt6373/registers.h; do
            diff --strip-trailing-cr -u "../ports/mt6985/linux-6.1/$f" "$f"
          done
          for f in drivers/mfd/mtk-spmi-pmic-experimental.c include/linux/mfd/mt6363/core.h include/linux/mfd/mt6373/core.h; do
            diff --strip-trailing-cr -u "../ports/mt6985/linux-6.1/$f" "$f"
          done
          diff --strip-trailing-cr -u ../ports/mt6985/linux-6.1/drivers/spmi/spmi-mt6985-experimental.c drivers/spmi/spmi-mt6985-experimental.c
          make -j"$(nproc)" drivers/spmi/spmi-mt6985-experimental.o
          grep -qx 'CONFIG_REGMAP_SPMI=y' .config
          make -j"$(nproc)" drivers/mfd/mtk-spmi-pmic-experimental.o drivers/regulator/mt6363-regulator.o drivers/regulator/mt6373-regulator.o
          grep -qx 'CONFIG_PM_GENERIC_DOMAINS_OF=y' .config
          diff --strip-trailing-cr -u ../ports/mt6985/linux-6.1/drivers/soc/mediatek/mt6985-ufs-power-experimental.c drivers/soc/mediatek/mt6985-ufs-power-experimental.c
          make -j"$(nproc)" drivers/soc/mediatek/mt6985-ufs-power-experimental.o
          diff --strip-trailing-cr -u ../ports/mt6985/linux-6.1/drivers/clk/mediatek/clk-mt6985-bus.c drivers/clk/mediatek/clk-mt6985-bus.c
          make -j"$(nproc)" drivers/clk/mediatek/clk-mt6985-peri.o drivers/clk/mediatek/clk-mt6985-bus.o drivers/ufs/host/ufs-mediatek.o
          aarch64-linux-gnu-readelf -h drivers/clk/mediatek/clk-mt6985-peri.o
          aarch64-linux-gnu-nm drivers/clk/mediatek/clk-mt6985-peri.o | grep -E 'ufsao_clks|ufspdn_clks|of_match_clk_mt6985_peri'
      - name: Upload object and provenance
        uses: actions/upload-artifact@v4
        with:
          name: mt6985-peripheral-gates-compile-only
          path: |
            linux-6.1/drivers/clk/mediatek/clk-mt6985-peri.o
            linux-6.1/drivers/clk/mediatek/clk-mt6985-bus.o
            linux-6.1/drivers/soc/mediatek/mt6985-ufs-power-experimental.o
            linux-6.1/drivers/ufs/host/ufs-mediatek.o
            linux-6.1/drivers/regulator/mt6363-regulator.o
            linux-6.1/drivers/regulator/mt6373-regulator.o
            linux-6.1/drivers/mfd/mtk-spmi-pmic-experimental.o
            linux-6.1/drivers/spmi/spmi-mt6985-experimental.o
            ports/mt6985/RCS-REVIEW.md
            ports/mt6985/PMIF-REVIEW.md
            ports/mt6985/MFD-REVIEW.md
            ports/mt6985/PMIC-DEPENDENCIES.md
            ports/mt6985/provenance.json
            ports/mt6985/power-provenance.json
            ports/mt6985/RECOVERY-DECISION.md
          if-no-files-found: error
